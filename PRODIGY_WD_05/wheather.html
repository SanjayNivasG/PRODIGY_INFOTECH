<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
      transition: 0.3s ease;
    }

    .search {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search input {
      padding: 10px 15px;
      border-radius: 25px;
      border: none;
      outline: none;
      flex: 1;
      max-width: 70%;
      font-size: 16px;
    }

    .search button {
      background-color: #3498db;
      border: none;
      padding: 10px 15px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s;
    }

    .search button:hover {
      background-color: #2980b9;
    }

    .search button img {
      height: 18px;
      width: 18px;
    }

    .weather-icon {
      width: 120px;
      margin: 20px auto;
    }

    .temp {
      font-size: 48px;
      font-weight: bold;
    }

    .city {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }

    .details div {
      text-align: center;
    }

    .details img {
      width: 40px;
      height: 40px;
      margin-bottom: 5px;
    }

    h5 {
      text-transform: capitalize;
      margin-top: 5px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px;
      }

      .temp {
        font-size: 36px;
      }

      .search input {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="search">
      <input type="text" placeholder="Search city..." id="cityinput" />
      <button>
        <img src="https://img.icons8.com/ios-glyphs/30/ffffff/search--v1.png" alt="Search" />
      </button>
    </div>
    <div class="inside">
      <img src="https://openweathermap.org/img/wn/01d@2x.png" class="weather-icon" alt="Weather Icon" />
      <h1 class="temp">--°C</h1>
      <h1 class="city">City Name</h1>
    </div>
    <div class="details">
      <div>
        <img src="https://img.icons8.com/fluency/48/humidity.png" />
        <p class="hum">--%</p>
        <h5>Humidity</h5>
      </div>
      <div>
        <img src="https://img.icons8.com/ios-filled/50/wind.png" />
        <p class="wind">-- km/h</p>
        <h5>Wind Speed</h5>
      </div>
    </div>
  </div>

  <script>
    const apikey = "4f7c8b9370d1b913a7d8b448fc5aa307";
    const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
    const searchbox = document.querySelector(".search input");
    const searchbtn = document.querySelector(".search button");
    const weatherIcon = document.querySelector(".weather-icon");
    async function checkweather(city) {
      const response = await fetch(`${apiurl}${city}&appid=${apikey}`);
      if (response.status === 404) {
        alert("City not found!");
        return;
      }
      const data = await response.json();
      document.querySelector(".city").innerHTML = data.name;
      document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
      document.querySelector(".hum").innerHTML = data.main.humidity + "%";
      document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

      const iconCode = data.weather[0].icon;
      weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }
    searchbtn.addEventListener("click", () => {
      const city = searchbox.value.trim();
      if (city) {
        checkweather(city);
      }
    });

    searchbox.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        const city = searchbox.value.trim();
        if (city) {
          checkweather(city);
        }
      }
    });
    window.onload = () => {
      checkweather("Coimbatore");
    };
  </script>
</body>
</html>
