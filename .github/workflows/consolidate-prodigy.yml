name: Consolidate Prodigy Projects

on:
  push:
    branches: [main]

concurrency:
  group: prodigy-consolidation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone and copy Prodigy repositories
        shell: bash
        run: |
          set -e

          repos=(
            "PRODIGY_WD_02"
            "PRODIGY_WD_03"
            "PRODIGY_WD_04"
            "PRODIGY_WD_05"
          )

          mkdir -p /tmp/prodigy-repos

          for repo in "${repos[@]}"; do
            echo "Cloning $repo..."
            git clone --depth 1 "https://github.com/SanjayNivasG/${repo}.git" "/tmp/prodigy-repos/${repo}"
            rm -rf "/tmp/prodigy-repos/${repo}/.git"

            mkdir -p "$repo"
            rsync -a --delete "/tmp/prodigy-repos/${repo}/" "$repo/"
          done

      - name: Commit consolidated projects
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Consolidate Prodigy projects"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed; synchronizing with origin/main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push after multiple attempts."
          exit 1
